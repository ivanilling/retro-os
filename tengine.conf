# Tengine / Nginx configuration for Retro OS
# Copy this to /etc/nginx/sites-available/retro-os and enable with:
# ln -s /etc/nginx/sites-available/retro-os /etc/nginx/sites-enabled/
# Then restart: nginx -s reload

server {
    listen 80;
    server_name your-domain.com;
    
    root /path/to/dist;
    index index.html;

    # Disable caching for HTML to prevent 410 errors
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Return 204 No Content for favicon.ico instead of 410
    location = /favicon.ico {
        return 204;
        add_header Cache-Control "max-age=86400";
    }

    # Serve favicon.svg with long cache
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static assets - cache for 1 year (Vite uses content hashes)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
