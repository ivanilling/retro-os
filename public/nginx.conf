# Nginx / Tengine configuration for Retro OS
# Place this in /etc/nginx/sites-available/ or include in main config

server {
    listen 80;
    server_name your-domain.com;
    root /path/to/dist;
    index index.html;

    # Disable caching for HTML
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Handle favicon.ico - return 204 No Content instead of 410
    location = /favicon.ico {
        return 204;
        add_header Cache-Control "max-age=86400";
    }

    # Handle favicon.svg
    location = /favicon.svg {
        add_header Cache-Control "max-age=86400";
    }

    # Static assets - cache for 1 year (Vite uses content hashes)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
