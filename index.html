<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ivanilling | Retro OS Portfolio</title>
    <meta name="description" content="Interactive retro operating system portfolio built with React and TypeScript." />
    <meta name="keywords" content="portfolio, react, typescript, retro, windows 95, games" />
    <meta property="og:title" content="ivanilling | Retro OS Portfolio" />
    <meta property="og:description" content="A unique portfolio experience - explore my work through a retro operating system interface." />
    <meta property="og:type" content="website" />
    <base href="./" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Loading state */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #00ff00;
        font-family: 'Courier New', monospace;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div style="text-align: center;">
          <div style="font-size: 48px; margin-bottom: 16px;">🖥️</div>
          <div>RETRO OS v1.0</div>
          <div style="margin-top: 8px; animation: pulse 1s infinite;">Booting...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </body>
</html>
