<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alex Chen | Retro OS Portfolio</title>
    <meta name="description" content="Full-stack developer portfolio presented as a retro operating system. Explore projects, skills, and contact info through an interactive desktop experience." />
    <meta name="keywords" content="developer, portfolio, full-stack, react, typescript, web development" />
    <meta property="og:title" content="Alex Chen | Retro OS Portfolio" />
    <meta property="og:description" content="A unique portfolio experience - explore my work through a retro operating system interface." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Loading state */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #00ff00;
        font-family: 'Courier New', monospace;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div style="text-align: center;">
          <div style="font-size: 48px; margin-bottom: 16px;">🖥️</div>
          <div>RETRO OS v1.0</div>
          <div style="margin-top: 8px; animation: pulse 1s infinite;">Booting...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </body>
</html>
